name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          uv venv
          uv pip install -e . pytest cvxpy ruff mypy
      - run: uv run --no-sync ruff check src tests examples benchmarks scripts
      - run: uv run --no-sync mypy src
      - run: uv run --no-sync pytest -q

  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Build documentation
        run: |
          uv sync --group docs --python 3.12
          uv run --no-sync python scripts/build_examples.py
          uv run --no-sync zensical build --clean --strict
          # Zensical silently skips unsupported plugins and missing pages: check the example pages
          for f in quickstart ard_feature_relevance logistic_probabilities low_level_api; do
            test -f "site/examples/$f/index.html" || { echo "missing example page $f"; exit 1; }
          done
      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
