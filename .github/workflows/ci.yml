name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          uv venv
          uv pip install -e . pytest cvxpy ruff mypy
      - run: uv run --no-sync ruff check src tests examples benchmarks scripts
      - run: uv run --no-sync mypy src
      - run: uv run --no-sync pytest -q

  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Build documentation
        run: |
          uv sync --group docs --python 3.12
          uv run --no-sync python scripts/build_examples.py
          uv run --no-sync zensical build --clean --strict
          # Zensical silently skips unsupported plugins and missing pages: check the example pages
          for f in quickstart ard_feature_relevance logistic_probabilities glm_counts low_level_api; do
            test -f "site/examples/$f/index.html" || { echo "missing example page $f"; exit 1; }
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy-docs:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: docs
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
