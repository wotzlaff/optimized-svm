site_name: optimized-svm
site_description: Support vector machines with hyperparameters tuned by exact gradients
site_url: https://wotzlaff.github.io/optimized-svm/
repo_url: https://github.com/wotzlaff/optimized-svm
repo_name: wotzlaff/optimized-svm
copyright: Copyright &copy; 2022–2026 Nico Strasdat

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle: { icon: material/weather-night, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle: { icon: material/weather-sunny, name: Light mode }

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Background:
      - Training problem: theory/training.md
      - Hyperparameter gradients: theory/hypergradient.md
  - Examples:
      - Quickstart: examples/quickstart.py
      - Feature relevance (ARD): examples/ard_feature_relevance.py
      - Low-level API: examples/low_level_api.py
  - Reproducing the thesis: reproduction.md
  - API reference: api.md
  - Changelog: changelog.md

markdown_extensions:
  - admonition
  - pymdownx.arithmatex: { generic: true }
  - pymdownx.highlight
  - pymdownx.superfences
  - tables
  - toc: { permalink: true }

extra_javascript:
  - javascripts/katex.js
  - https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js
  - https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js
extra_css:
  - https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css

plugins:
  - search
  - mkdocs-jupyter:
      execute: true
      include: ["*.py"]
      ignore: ["__pycache__/*"]
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            show_source: false
            members_order: source
            show_root_heading: true
